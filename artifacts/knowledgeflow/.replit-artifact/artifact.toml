kind = "web"
previewPath = "/"
title = "Knowledge Flow Books"
version = "1.0.0"
id = "artifacts/knowledgeflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25363

[services.development]
run = "pnpm --filter @workspace/knowledgeflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/knowledgeflow", "run", "build" ]
publicDir = "artifacts/knowledgeflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25363"
BASE_PATH = "/"
